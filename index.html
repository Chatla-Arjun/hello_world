<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Hello World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #8E2DE2;
            --secondary-color: #4A00E0;
            --text-color: #ffffff;
            --accent-color: #00ff87;
        }

        .dark-mode {
            --primary-color: #141E30;
            --secondary-color: #243B55;
            --text-color: #ffffff;
            --accent-color: #00ff87;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, var(--primary-color), var(--secondary-color), #e73c7e, #23a6d5);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--text-color);
            transition: all 0.5s ease;
        }

        .container {
            text-align: center;
            padding: 2rem;
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.5em;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        .button {
            padding: 12px 24px;
            border: 2px solid var(--accent-color);
            border-radius: 25px;
            text-decoration: none;
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            margin: 10px;
            display: inline-block;
        }

        .button:hover {
            background: var(--accent-color);
            color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .social-icons {
            margin-top: 30px;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 24px;
            margin: 0 10px;
            transition: transform 0.3s ease;
        }

        .social-icons a:hover {
            transform: scale(1.2);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 24px;
            color: var(--text-color);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* New styles */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spin {
            width: 50px;
            height: 50px;
            border: 5px solid var(--text-color);
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            transform: translateY(50px);
            opacity: 0;
            transition: all 0.5s;
        }

        .card.visible {
            transform: translateY(0);
            opacity: 1;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cursor-trail {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s;
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="loader-spin"></div>
    </div>
    <div id="particles-js"></div>
    <div class="theme-toggle">
        <i class="fas fa-moon"></i>
    </div>
    <div class="container">
        <h1>Hello, World!</h1>
        <p class="subtitle">Welcome to my beautiful webpage</p>
        <a href="#" class="button">Learn More</a>
        <a href="#" class="button">Get Started</a>
        <div class="social-icons">
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
        <div class="card">
            <h2>About</h2>
            <p>This is a beautiful webpage showcasing modern web design features.</p>
        </div>
        <div class="card">
            <h2>Features</h2>
            <p>Dark mode, animations, particles, and more!</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Loading animation
        window.addEventListener('load', () => {
            document.querySelector('.loader').classList.add('hidden');
        });

        // Scroll animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        });

        document.querySelectorAll('.card').forEach(card => {
            observer.observe(card);
        });

        // Particle background
        particlesJS('particles-js', {
            particles: {
                number: { value: 80 },
                color: { value: '#ffffff' },
                opacity: { value: 0.5 },
                size: { value: 3 },
                line_linked: {
                    enable: true,
                    color: '#ffffff',
                    opacity: 0.2
                },
                move: { enable: true, speed: 2 }
            }
        });

        // Theme toggle
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const icon = themeToggle.querySelector('i');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
        });

        // Cursor trail effect
        function createTrailDot() {
            const dot = document.createElement('div');
            dot.className = 'cursor-trail';
            document.body.appendChild(dot);
            return dot;
        }

        const trailDots = Array.from({ length: 20 }, createTrailDot);
        const colors = ['#ff0000', '#ff9900', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'];
        let currentIndex = 0;

        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            trailDots.forEach((dot, index) => {
                setTimeout(() => {
                    dot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
                    dot.style.backgroundColor = colors[(currentIndex + index) % colors.length];
                }, index * 40);
            });
            
            currentIndex = (currentIndex + 1) % colors.length;
        });
    </script>
</body>
</html>
